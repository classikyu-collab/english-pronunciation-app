<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>영어 발음 연습</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    background: #f7f8fa;
    height: 100%;
  }
  .screen {
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 32px;
    min-height: 100vh;
  }
  h1 {
    color: #1a73e8;
    font-size: 40px;
    text-align: center;
    margin: 0 0 40px 0;
  }

  /* ---------- 로그인(터치 선택) 화면 ---------- */
  #loginBox { display: block; }
  .section-label {
    font-size: 22px;
    color: #333;
    margin: 24px 0 16px 0;
    text-align: center;
  }
  .student-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 20px;
  }
  .student-card {
    background: white;
    border: 3px solid #e0e0e0;
    border-radius: 20px;
    padding: 24px 12px;
    text-align: center;
    cursor: pointer;
    user-select: none;
    transition: transform 0.08s ease, border-color 0.15s ease;
    min-height: 120px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .student-card:active { transform: scale(0.95); }
  .student-card.selected { border-color: #1a73e8; background: #eaf2fe; }
  .avatar {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: #1a73e8;
    color: white;
    font-size: 24px;
    font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 10px;
  }
  .student-name { font-size: 20px; font-weight: bold; color: #222; }
  .student-level { font-size: 14px; color: #888; margin-top: 4px; }
  .loading-text { text-align: center; color: #888; font-size: 18px; padding: 40px 0; }

  /* ---------- 연습 화면 ---------- */
  #practiceBox { display: none; }
  .top-bar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 24px;
  }
  .who-am-i { font-size: 20px; color: #555; }
  .switch-btn {
    background: #eee; border: none; border-radius: 12px;
    padding: 14px 20px; font-size: 16px; color: #555; cursor: pointer;
  }
  #sentenceBox {
    background: white;
    border-radius: 20px;
    padding: 48px 24px;
    margin: 20px 0 24px 0;
    text-align: center;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }
  #sentenceText { font-size: 34px; color: #1a1a1a; line-height: 1.4; }
  #translation { color: #888; font-size: 18px; margin-top: 14px; }

  #attemptInfo { text-align: center; font-size: 20px; color: #555; margin-bottom: 6px; }
  #attemptHistory { text-align: center; font-size: 15px; color: #999; margin-bottom: 20px; letter-spacing: 0.3px; }

  /* ---------- 상태 배너 (녹음중/채점중/오류) ---------- */
  .status-banner {
    display: none;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-size: 20px;
    font-weight: bold;
    color: #1a73e8;
    background: #eaf2fe;
    border-radius: 16px;
    padding: 14px 20px;
    margin-bottom: 20px;
  }
  .status-banner.show { display: flex; }
  .status-banner.error { color: #d93025; background: #fdeceb; }
  .spinner {
    width: 22px; height: 22px;
    border: 3px solid #cfe0fb;
    border-top-color: #1a73e8;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    flex-shrink: 0;
  }
  .status-banner.error .spinner { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- 버튼 ---------- */
  .button-row {
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-width: 420px;
    margin: 0 auto;
  }
  @media (min-width: 560px) {
    .button-row.two { flex-direction: row; max-width: 620px; }
  }
  .big-btn {
    flex: 1;
    display: block;
    width: 100%;
    padding: 24px 20px;
    font-size: 24px;
    font-weight: bold;
    border-radius: 20px;
    cursor: pointer;
    transition: transform 0.08s ease, opacity 0.15s ease;
    border: 3px solid transparent;
  }
  .big-btn:active { transform: scale(0.97); }
  .big-btn:focus { outline: none; }
  .big-btn:focus-visible { outline: 3px solid #90c2ff; outline-offset: 2px; }
  .big-btn:disabled { opacity: 0.4; pointer-events: none; }

  .btn-primary { background: #ea4335; color: white; }
  .btn-primary.recording { background: #757575; }
  .btn-outline { background: white; color: #1a73e8; border-color: #1a73e8; }

  #resultBox {
    display: none;
    margin-top: 24px;
    padding: 28px;
    border-radius: 20px;
    background: #e6f4ea;
  }
  #resultBox p { font-size: 22px; margin: 10px 0; color: #1a1a1a; }
  #resultBox .main-score { font-size: 30px; font-weight: bold; color: #1a73e8; }

  @media (max-width: 500px) {
    h1 { font-size: 30px; }
    #sentenceText { font-size: 26px; }
    .big-btn { font-size: 20px; padding: 20px 16px; }
  }
</style>
</head>
<body>
<div class="screen">
  <h1>영어 발음 연습</h1>

  <div id="loginBox">
    <div class="section-label">이름을 눌러주세요</div>
    <div id="studentGrid" class="student-grid">
      <div class="loading-text">학생 목록을 불러오는 중...</div>
    </div>
  </div>

  <div id="practiceBox">
    <div class="top-bar">
      <div class="who-am-i" id="whoAmI"></div>
      <button class="switch-btn" id="switchBtn">다른 학생으로 전환</button>
    </div>

    <div id="sessionProgress" style="text-align:center; font-size:18px; color:#1a73e8; font-weight:bold; margin-bottom:12px;"></div>

    <div id="sentenceBox">
      <div id="sentenceText">문장을 불러오는 중...</div>
      <div id="translation"></div>
    </div>

    <div id="attemptInfo"></div>
    <div id="attemptHistory"></div>

    <div id="statusBanner" class="status-banner">
      <div class="spinner"></div>
      <span id="statusText"></span>
    </div>

    <div class="button-row" id="buttonRow">
      <button id="recordBtn" class="big-btn btn-primary">🎤 녹음 시작</button>
      <button id="nextBtn" class="big-btn btn-outline" style="display:none;">다음 문장 ➜</button>
    </div>

    <div id="resultBox">
      <p>정확도: <span class="main-score" id="scoreAccuracy"></span>점</p>
      <p>유창성: <span id="scoreFluency"></span>점</p>
      <p>완성도: <span id="scoreCompleteness"></span>점</p>
      <p style="color:#666; font-size:18px;">인식된 문장: <span id="recognizedText"></span></p>
    </div>
  </div>

  <div id="completeBox" style="display:none; text-align:center;">
    <div style="font-size:60px; margin-bottom:20px;">🎉</div>
    <div style="font-size:28px; font-weight:bold; color:#1a73e8; margin-bottom:12px;">오늘 연습을 모두 마쳤어요!</div>
    <div style="font-size:18px; color:#666; margin-bottom:32px;">수고했어요. 다음에 또 만나요.</div>
    <button class="big-btn btn-primary" id="restartBtn" style="max-width:300px; margin:0 auto; display:block;">처음으로</button>
  </div>
</div>

<script>
  // ⚠️ 아래 URL을 본인의 Apps Script 웹앱 배포 URL로 바꿔주세요.
  var API_URL = "https://script.google.com/macros/s/AKfycbyg8z9HTCRa-pfzI1e8ea8wXpJqKZxtZzqxntwM9Ef2JvFaeZUf14ZuAJiQ1rUNgXEC4w/exec";

  var studentName = "";
  var level = "";
  var currentSentence = null;
  var attemptNumber = 0;
  var maxAttempts = 3;
  var sentenceIndex = 0;
  var totalSentences = 5;
  var usedSentenceIds = [];
  var attemptScores = []; // 이번 문장에서 시도별 정확도(보정) 기록

  var mediaRecorder = null;
  var recordedChunks = [];
  var isRecording = false;

  function callApi(action, payload) {
    var body = Object.assign({ action: action }, payload || {});
    return fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(body)
    })
      .then(function (res) { return res.json(); })
      .then(function (json) {
        if (!json.success) throw new Error(json.error || "알 수 없는 서버 오류");
        return json.data;
      });
  }

  // ---------- 상태 배너 헬퍼 ----------
  function showStatus(text, isError) {
    var banner = document.getElementById("statusBanner");
    banner.classList.toggle("error", !!isError);
    banner.classList.add("show");
    document.getElementById("statusText").textContent = text;
  }
  function hideStatus() {
    document.getElementById("statusBanner").classList.remove("show");
  }
  function setButtonsDisabled(disabled) {
    document.getElementById("recordBtn").disabled = disabled;
    document.getElementById("nextBtn").disabled = disabled;
  }
  function updateButtonRowLayout() {
    var nextVisible = document.getElementById("nextBtn").style.display !== "none";
    document.getElementById("buttonRow").classList.toggle("two", nextVisible);
  }

  // ---------- 로그인 화면: 학생 목록 불러와서 터치 카드로 표시 ----------
  function loadStudentGrid() {
    callApi("getStudentList")
      .then(function (students) {
        var grid = document.getElementById("studentGrid");
        grid.innerHTML = "";

        if (!students || students.length === 0) {
          grid.innerHTML = '<div class="loading-text">학생목록 시트에 등록된 학생이 없습니다.</div>';
          return;
        }

        students.forEach(function (student) {
          var card = document.createElement("div");
          card.className = "student-card";
          card.innerHTML =
            '<div class="avatar">' + student.name.charAt(0) + '</div>' +
            '<div class="student-name">' + student.name + '</div>' +
            '<div class="student-level">' + student.level + '</div>';
          card.onclick = function () {
            studentName = student.name;
            level = student.level;
            enterPractice();
          };
          grid.appendChild(card);
        });
      })
      .catch(function (err) {
        document.getElementById("studentGrid").innerHTML =
          '<div class="loading-text">불러오기 실패: ' + err.message + '</div>';
      });
  }

  function enterPractice() {
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("completeBox").style.display = "none";
    document.getElementById("practiceBox").style.display = "block";
    document.getElementById("whoAmI").textContent = studentName + " (" + level + ")";

    sentenceIndex = 0;
    usedSentenceIds = [];

    Promise.all([
      callApi("getMaxAttempts"),
      callApi("getMaxSentencesPerSession")
    ]).then(function (results) {
      maxAttempts = results[0];
      totalSentences = results[1];
      loadNewSentence();
    }).catch(function (err) {
      document.getElementById("sentenceText").textContent = "초기화 오류: " + err.message;
    });
  }

  document.getElementById("switchBtn").onclick = function () {
    document.getElementById("practiceBox").style.display = "none";
    document.getElementById("loginBox").style.display = "block";
    loadStudentGrid();
  };

  function loadNewSentence() {
    sentenceIndex++;

    if (sentenceIndex > totalSentences) {
      showCompleteScreen();
      return;
    }

    attemptNumber = 0;
    attemptScores = [];
    hideStatus();
    document.getElementById("resultBox").style.display = "none";
    document.getElementById("nextBtn").style.display = "none";
    document.getElementById("recordBtn").style.display = "block";
    document.getElementById("recordBtn").textContent = "🎤 녹음 시작";
    document.getElementById("recordBtn").classList.remove("recording");
    setButtonsDisabled(false);
    updateButtonRowLayout();
    document.getElementById("sentenceText").textContent = "문장을 불러오는 중...";
    document.getElementById("sessionProgress").textContent =
      "문장 " + sentenceIndex + " / " + totalSentences;
    renderAttemptHistory();

    callApi("getRandomSentence", { level: level, excludeIds: usedSentenceIds })
      .then(function (sentence) {
        if (!sentence) {
          document.getElementById("sentenceText").textContent =
            "해당 레벨의 문장이 없습니다. 문장DB를 확인해주세요.";
          return;
        }
        currentSentence = sentence;
        usedSentenceIds.push(sentence.id);
        document.getElementById("sentenceText").textContent = sentence.text;
        document.getElementById("translation").textContent = sentence.translation || "";
        updateAttemptInfo();
      })
      .catch(function (err) {
        showStatus("오류: " + err.message, true);
      });
  }

  function updateAttemptInfo() {
    document.getElementById("attemptInfo").textContent =
      "시도 " + attemptNumber + " / " + maxAttempts;
  }

  function renderAttemptHistory() {
    var parts = [];
    for (var i = 0; i < maxAttempts; i++) {
      var label = (i + 1) + "차: " + (attemptScores[i] != null ? Math.round(attemptScores[i]) : "-");
      parts.push(label);
    }
    document.getElementById("attemptHistory").textContent = parts.join(" · ");
  }

  function showCompleteScreen() {
    document.getElementById("practiceBox").style.display = "none";
    document.getElementById("completeBox").style.display = "block";
  }

  document.getElementById("restartBtn").onclick = function () {
    document.getElementById("completeBox").style.display = "none";
    document.getElementById("loginBox").style.display = "block";
    loadStudentGrid();
  };

  document.getElementById("recordBtn").onclick = function () {
    if (!isRecording) startRecording(); else stopRecording();
  };

  document.getElementById("nextBtn").onclick = function () {
    if (currentSentence) {
      callApi("finalizeBestScore", { studentName: studentName, sentenceId: currentSentence.id });
    }
    loadNewSentence();
  };

  function startRecording() {
    if (attemptNumber >= maxAttempts) return; // 방어적 처리 (버튼이 이미 숨겨져 있어야 정상)

    // 새 시도를 시작하므로 이전 결과는 즉시 숨기고, 다음 문장 버튼도 잠시 비활성화
    document.getElementById("resultBox").style.display = "none";
    document.getElementById("nextBtn").disabled = true;

    navigator.mediaDevices.getUserMedia({ audio: true })
      .then(function (stream) {
        recordedChunks = [];
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = function (e) {
          if (e.data.size > 0) recordedChunks.push(e.data);
        };
        mediaRecorder.onstop = function () {
          stream.getTracks().forEach(function (track) { track.stop(); });
          var blob = new Blob(recordedChunks, { type: "audio/webm" });
          processAudio(blob);
        };
        mediaRecorder.start();
        isRecording = true;
        var btn = document.getElementById("recordBtn");
        btn.textContent = "⏹ 녹음 종료";
        btn.classList.add("recording");
        showStatus("녹음 중입니다...", false);
      })
      .catch(function (err) {
        showStatus("마이크 접근 실패: " + err.message, true);
        document.getElementById("nextBtn").disabled = false;
      });
  }

  function stopRecording() {
    mediaRecorder.stop();
    isRecording = false;
    var btn = document.getElementById("recordBtn");
    btn.textContent = "🎤 녹음 시작";
    btn.classList.remove("recording");
    btn.disabled = true; // 채점 끝날 때까지 재클릭 방지
    showStatus("채점 중입니다...", false);
  }

  function processAudio(blob) {
    var reader = new FileReader();
    reader.onload = function () {
      var arrayBuffer = reader.result;
      var audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      audioCtx.decodeAudioData(
        arrayBuffer,
        function (audioBuffer) {
          resampleTo16k(audioBuffer, function (resampledBuffer) {
            var wavBlob = encodeWav(resampledBuffer);
            var wavReader = new FileReader();
            wavReader.onload = function () {
              var base64Audio = wavReader.result.split(",")[1];
              sendToServer(base64Audio);
            };
            wavReader.readAsDataURL(wavBlob);
          });
        },
        function (err) {
          showStatus("오디오 디코딩 실패: " + err, true);
          document.getElementById("recordBtn").disabled = false;
          document.getElementById("nextBtn").disabled = false;
        }
      );
    };
    reader.readAsArrayBuffer(blob);
  }

  function resampleTo16k(audioBuffer, callback) {
    var targetRate = 16000;
    var offlineCtx = new OfflineAudioContext(1, Math.ceil(audioBuffer.duration * targetRate), targetRate);
    var source = offlineCtx.createBufferSource();
    source.buffer = audioBuffer;
    source.connect(offlineCtx.destination);
    source.start(0);
    offlineCtx.startRendering().then(function (renderedBuffer) { callback(renderedBuffer); });
  }

  function encodeWav(audioBuffer) {
    var samples = audioBuffer.getChannelData(0);
    var buffer = new ArrayBuffer(44 + samples.length * 2);
    var view = new DataView(buffer);
    function writeString(offset, str) {
      for (var i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
    }
    writeString(0, "RIFF");
    view.setUint32(4, 36 + samples.length * 2, true);
    writeString(8, "WAVE");
    writeString(12, "fmt ");
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true);
    view.setUint16(22, 1, true);
    view.setUint32(24, 16000, true);
    view.setUint32(28, 16000 * 2, true);
    view.setUint16(32, 2, true);
    view.setUint16(34, 16, true);
    writeString(36, "data");
    view.setUint32(40, samples.length * 2, true);
    var offset = 44;
    for (var i = 0; i < samples.length; i++, offset += 2) {
      var s = Math.max(-1, Math.min(1, samples[i]));
      view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7fff, true);
    }
    return new Blob([view], { type: "audio/wav" });
  }

  function sendToServer(base64Audio) {
    attemptNumber++;
    updateAttemptInfo();

    callApi("submitRecording", {
      studentName: studentName,
      sentenceId: currentSentence.id,
      referenceText: currentSentence.text,
      attemptNumber: attemptNumber,
      audioBase64: base64Audio
    })
      .then(function (result) {
        hideStatus();
        document.getElementById("resultBox").style.display = "block";
        document.getElementById("scoreAccuracy").textContent = Math.round(result.accuracyScore);
        document.getElementById("scoreFluency").textContent = Math.round(result.fluencyScore);
        document.getElementById("scoreCompleteness").textContent = Math.round(result.completenessScore);
        document.getElementById("recognizedText").textContent = result.recognizedText;

        attemptScores[attemptNumber - 1] = result.accuracyScore;
        renderAttemptHistory();

        // 매 시도 후 "다음 문장"은 항상 선택 가능
        document.getElementById("nextBtn").style.display = "block";
        document.getElementById("nextBtn").disabled = false;
        updateButtonRowLayout();

        if (attemptNumber >= maxAttempts) {
          document.getElementById("recordBtn").style.display = "none";
        } else {
          document.getElementById("recordBtn").disabled = false;
          document.getElementById("recordBtn").textContent = "🎤 다시 도전";
        }
      })
      .catch(function (err) {
        showStatus("채점 오류: " + err.message, true);
        document.getElementById("recordBtn").disabled = false;
        document.getElementById("nextBtn").disabled = false;
      });
  }

  // 초기 진입: 학생 선택 화면 표시
  loadStudentGrid();
</script>
</body>
</html>
