<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영어 발음 연습</title>
<style>
  body { font-family: 'Malgun Gothic', sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
  h2 { color: #1a73e8; }
  #sentenceBox { background: #f1f3f4; border-radius: 8px; padding: 20px; margin: 20px 0; font-size: 20px; text-align: center; }
  #translation { color: #666; font-size: 14px; margin-top: 8px; }
  button { padding: 12px 20px; font-size: 16px; border: none; border-radius: 6px; cursor: pointer; margin: 6px 4px; }
  #recordBtn { background: #ea4335; color: white; }
  #recordBtn.recording { background: #999; }
  #nextBtn { background: #1a73e8; color: white; }
  #resultBox { margin-top: 20px; padding: 16px; border-radius: 8px; background: #e6f4ea; display: none; }
  #resultBox p { margin: 4px 0; }
  #status { color: #d93025; font-size: 14px; min-height: 20px; }
  #attemptInfo { font-size: 14px; color: #555; }
  input[type=text] { padding: 8px; font-size: 16px; width: 100%; box-sizing: border-box; margin-bottom: 12px; }
</style>
</head>
<body>
  <h2>영어 발음 연습</h2>

  <div id="loginBox">
    <label>이름을 입력하세요</label>
    <input type="text" id="studentName" placeholder="예: 신승환">
    <label>레벨을 선택하세요</label>
    <select id="levelSelect">
      <option value="초급">초급</option>
      <option value="중급">중급</option>
      <option value="고급">고급</option>
    </select>
    <button id="startBtn" style="background:#1a73e8;color:white;">시작하기</button>
  </div>

  <div id="practiceBox" style="display:none;">
    <div id="sentenceBox">
      <div id="sentenceText">문장을 불러오는 중...</div>
      <div id="translation"></div>
    </div>

    <div id="attemptInfo"></div>
    <button id="recordBtn">🎤 녹음 시작</button>
    <button id="nextBtn" style="display:none;">다음 문장</button>
    <div id="status"></div>

    <div id="resultBox">
      <p>정확도: <span id="scoreAccuracy"></span>점</p>
      <p>유창성: <span id="scoreFluency"></span>점</p>
      <p>완성도: <span id="scoreCompleteness"></span>점</p>
      <p>인식된 문장: <span id="recognizedText"></span></p>
    </div>
  </div>

  <script>
    // ⚠️ 아래 URL을 본인의 Apps Script 웹앱 배포 URL로 바꿔주세요.
    // 배포 방법: Apps Script 편집기 → 배포 → 새 배포 → 웹 앱 → URL 복사
    var API_URL = "https://script.google.com/macros/s/AKfycbyg8z9HTCRa-pfzI1e8ea8wXpJqKZxtZzqxntwM9Ef2JvFaeZUf14ZuAJiQ1rUNgXEC4w/exec";

    var studentName = "";
    var level = "";
    var currentSentence = null;
    var attemptNumber = 0;
    var maxAttempts = 3;

    var mediaRecorder = null;
    var recordedChunks = [];
    var isRecording = false;

    /**
     * Apps Script API 서버(doPost)를 호출하는 공통 함수.
     * text/plain 컨텐츠 타입을 사용해 브라우저의 CORS 사전요청(preflight)을 피합니다.
     */
    function callApi(action, payload) {
      var body = Object.assign({ action: action }, payload || {});
      return fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(body)
      })
        .then(function (res) { return res.json(); })
        .then(function (json) {
          if (!json.success) {
            throw new Error(json.error || "알 수 없는 서버 오류");
          }
          return json.data;
        });
    }

    document.getElementById("startBtn").onclick = function () {
      studentName = document.getElementById("studentName").value.trim();
      level = document.getElementById("levelSelect").value;
      if (!studentName) {
        alert("이름을 입력해주세요.");
        return;
      }
      document.getElementById("loginBox").style.display = "none";
      document.getElementById("practiceBox").style.display = "block";

      callApi("getMaxAttempts").then(function (value) {
        maxAttempts = value;
        loadNewSentence();
      });
    };

    function loadNewSentence() {
      attemptNumber = 0;
      document.getElementById("resultBox").style.display = "none";
      document.getElementById("nextBtn").style.display = "none";
      document.getElementById("status").textContent = "";
      document.getElementById("sentenceText").textContent = "문장을 불러오는 중...";

      callApi("getRandomSentence", { level: level })
        .then(function (sentence) {
          if (!sentence) {
            document.getElementById("sentenceText").textContent =
              "해당 레벨의 문장이 없습니다. 문장DB를 확인해주세요.";
            return;
          }
          currentSentence = sentence;
          document.getElementById("sentenceText").textContent = sentence.text;
          document.getElementById("translation").textContent = sentence.translation || "";
          updateAttemptInfo();
        })
        .catch(function (err) {
          document.getElementById("status").textContent = "오류: " + err.message;
        });
    }

    function updateAttemptInfo() {
      document.getElementById("attemptInfo").textContent =
        "시도 " + attemptNumber + " / " + maxAttempts;
    }

    document.getElementById("recordBtn").onclick = function () {
      if (!isRecording) {
        startRecording();
      } else {
        stopRecording();
      }
    };

    document.getElementById("nextBtn").onclick = function () {
      loadNewSentence();
    };

    function startRecording() {
      if (attemptNumber >= maxAttempts) {
        document.getElementById("status").textContent =
          "이 문장에 대한 시도 횟수를 모두 사용했습니다. 다음 문장으로 넘어가세요.";
        return;
      }

      navigator.mediaDevices
        .getUserMedia({ audio: true })
        .then(function (stream) {
          recordedChunks = [];
          mediaRecorder = new MediaRecorder(stream);

          mediaRecorder.ondataavailable = function (e) {
            if (e.data.size > 0) recordedChunks.push(e.data);
          };

          mediaRecorder.onstop = function () {
            stream.getTracks().forEach(function (track) { track.stop(); });
            var blob = new Blob(recordedChunks, { type: "audio/webm" });
            processAudio(blob);
          };

          mediaRecorder.start();
          isRecording = true;
          document.getElementById("recordBtn").textContent = "⏹ 녹음 종료";
          document.getElementById("recordBtn").classList.add("recording");
          document.getElementById("status").textContent = "녹음 중입니다...";
        })
        .catch(function (err) {
          document.getElementById("status").textContent =
            "마이크 접근 실패: " + err.message;
        });
    }

    function stopRecording() {
      mediaRecorder.stop();
      isRecording = false;
      document.getElementById("recordBtn").textContent = "🎤 녹음 시작";
      document.getElementById("recordBtn").classList.remove("recording");
      document.getElementById("status").textContent = "채점 중입니다...";
    }

    /**
     * 녹음된 webm 오디오를 Azure가 요구하는
     * WAV(16kHz, 16bit, mono) 형식으로 변환한 뒤 서버로 전송합니다.
     */
    function processAudio(blob) {
      var reader = new FileReader();
      reader.onload = function () {
        var arrayBuffer = reader.result;
        var audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        audioCtx.decodeAudioData(
          arrayBuffer,
          function (audioBuffer) {
            resampleTo16k(audioBuffer, function (resampledBuffer) {
              var wavBlob = encodeWav(resampledBuffer);
              var wavReader = new FileReader();
              wavReader.onload = function () {
                var base64Audio = wavReader.result.split(",")[1];
                sendToServer(base64Audio);
              };
              wavReader.readAsDataURL(wavBlob);
            });
          },
          function (err) {
            document.getElementById("status").textContent =
              "오디오 디코딩 실패: " + err;
          }
        );
      };
      reader.readAsArrayBuffer(blob);
    }

    function resampleTo16k(audioBuffer, callback) {
      var targetRate = 16000;
      var offlineCtx = new OfflineAudioContext(
        1,
        Math.ceil(audioBuffer.duration * targetRate),
        targetRate
      );
      var source = offlineCtx.createBufferSource();
      source.buffer = audioBuffer;
      source.connect(offlineCtx.destination);
      source.start(0);
      offlineCtx.startRendering().then(function (renderedBuffer) {
        callback(renderedBuffer);
      });
    }

    function encodeWav(audioBuffer) {
      var samples = audioBuffer.getChannelData(0);
      var buffer = new ArrayBuffer(44 + samples.length * 2);
      var view = new DataView(buffer);

      function writeString(offset, str) {
        for (var i = 0; i < str.length; i++) {
          view.setUint8(offset + i, str.charCodeAt(i));
        }
      }

      writeString(0, "RIFF");
      view.setUint32(4, 36 + samples.length * 2, true);
      writeString(8, "WAVE");
      writeString(12, "fmt ");
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true); // PCM
      view.setUint16(22, 1, true); // mono
      view.setUint32(24, 16000, true); // sample rate
      view.setUint32(28, 16000 * 2, true); // byte rate
      view.setUint16(32, 2, true); // block align
      view.setUint16(34, 16, true); // bits per sample
      writeString(36, "data");
      view.setUint32(40, samples.length * 2, true);

      var offset = 44;
      for (var i = 0; i < samples.length; i++, offset += 2) {
        var s = Math.max(-1, Math.min(1, samples[i]));
        view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7fff, true);
      }

      return new Blob([view], { type: "audio/wav" });
    }

    function sendToServer(base64Audio) {
      attemptNumber++;
      updateAttemptInfo();

      callApi("submitRecording", {
        studentName: studentName,
        sentenceId: currentSentence.id,
        referenceText: currentSentence.text,
        attemptNumber: attemptNumber,
        audioBase64: base64Audio
      })
        .then(function (result) {
          document.getElementById("status").textContent = "";
          document.getElementById("resultBox").style.display = "block";
          document.getElementById("scoreAccuracy").textContent = Math.round(result.accuracyScore);
          document.getElementById("scoreFluency").textContent = Math.round(result.fluencyScore);
          document.getElementById("scoreCompleteness").textContent = Math.round(result.completenessScore);
          document.getElementById("recognizedText").textContent = result.recognizedText;

          if (attemptNumber >= maxAttempts) {
            callApi("finalizeBestScore", {
              studentName: studentName,
              sentenceId: currentSentence.id
            });
            document.getElementById("nextBtn").style.display = "inline-block";
          }
        })
        .catch(function (err) {
          document.getElementById("status").textContent = "채점 오류: " + err.message;
        });
    }
  </script>
</body>
</html>
